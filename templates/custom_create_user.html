{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Create User</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>
  <body>
    <div class="font-seif p-5 h-screen w-full fixed">
      <form
        class="absolute left-1/2 top-1/2 -translate-1/2 grid gap-2 grid shadow-2xl w-8/10 max-w-120 p-5"
        action=""
        method="post"
      >
        {% csrf_token %}

        <h1 class="font-bold text-center">User Creation Form</h1>
        {% for message in messages %} {% if message.tags == "success" %}
        <p class="bg-green-500 p-2 text-white">{{message}}</p>
        {% else %}

        <p class="bg-red-700 p-2 text-white text-center">{{message}}</p>
        {% endif %} {% endfor %}
        <p class="bg-green-500 p-2 text-white">{{message}}</p>
        <label for="username">
          <span>Username:</span>
          <span>
            <input type="text" id="username" placeholder="Enter username" />
          </span>
        </label>
      </form>

      <form action="">
        <label for="email">
          <span>Email:</span>
          <span>
            <input type="email" id="email" placeholder="Enter email" />
          </span>
        </label>
      </form>

      <form action="">
        <label for="password">
          <span>password:</span>
          <span>
            <input type="password" id="password" placeholder="Enter password" />
          </span>
        </label>
      </form>

      <form action="">
        <label for="confirm_password">
          <span>confirm_password:</span>
          <span>
            <input
              type="confirm_password"
              id="confirm_password"
              placeholder="Enter confirm_password"
            />
          </span>
        </label>

        <button class="bg-green-500 text-white p-2" type="submit">
          submit
        </button>
      </form>
    </div>
  </body>
</html>
